name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prosody
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: prosody_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prosody -d prosody_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://prosody:test-only@localhost:5432/prosody_test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        working-directory: backend
        run: uv sync --dev --frozen

      - name: Lockfile up-to-date
        working-directory: backend
        run: uv lock --check

      - name: Lint
        working-directory: backend
        run: uv run ruff check . && uv run ruff format --check .

      - name: Run tests
        working-directory: backend
        run: uv run pytest -v

  mobile:
    name: Mobile Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: TypeScript check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Progress queue tests
        working-directory: mobile
        run: npm run test:progress

      - name: Run tests
        working-directory: mobile
        run: npm test -- --runInBand

      - name: Lint
        working-directory: mobile
        run: npx oxlint .

      - name: Format check
        working-directory: mobile
        run: npx oxfmt --check .
